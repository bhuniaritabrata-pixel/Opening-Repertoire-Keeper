kind = "mobile"
previewPath = "/"
title = "Chess Repertoire"
version = "1.0.0"
id = "artifacts/chess-repertoire"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 22824

[services.development]
run = "pnpm --filter @workspace/chess-repertoire run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chess-repertoire", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/chess-repertoire", "run", "serve" ]

[services.env]
PORT = "22824"
BASE_PATH = "/"
